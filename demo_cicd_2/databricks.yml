# This is a Declarative Automation Bundle definition for demo_cicd_2.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: demo_cicd_2
  uuid: e85c8e19-c6db-489a-ba95-80cc53232678

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: http://127.0.0.1:7073
    variables:
      catalog: fq_free_catalog
      schema: dev_demo
  prod:
    mode: production
    workspace:
      host: http://127.0.0.1:7073
      # We explicitly deploy to /Workspace/Users/hassanahyaan60@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/hassanahyaan60@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: fq_free_catalog
      schema: prod
    permissions:
      - user_name: hassanahyaan60@gmail.com
        level: CAN_MANAGE
